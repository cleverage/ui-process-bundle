parameters:
    upload_directory: '%kernel.cache_dir%/uploads'
    # SQLite by default; the CI runs the migrations on MySQL / MariaDB / PostgreSQL with DATABASE_URL
    env(DATABASE_URL): 'sqlite:///%kernel.cache_dir%/test.db'

framework:
    secret: 'test'
    test: true
    http_method_override: false
    session:
        storage_factory_id: session.storage.factory.mock_file
    router:
        utf8: true
    messenger:
        transports:
            execute_process: 'in-memory://'
            scheduler_cron: 'in-memory://'
    validation:
        email_validation_mode: html5
    notifier:
        chatter_transports:
            test: 'null://null'
        channel_policy:
            high: ['chat/test']
            medium: ['chat/test']
            low: ['chat/test']

security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: plaintext
    firewalls:
        main:
            lazy: true

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        auto_mapping: true
        # As the Symfony recipe: the indexes of the bundle entities use snake_case column names
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
            CleverAgeUiProcessBundle:
                type: attribute
                is_bundle: true

monolog:
    handlers:
        main:
            type: 'null'

twig:
    default_path: '%kernel.project_dir%/templates'

clever_age_process:
    configurations:
        test.process:
            description: 'Process used by the functional tests'
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.form:
            description: 'Process launched with the UI form, text input'
            entry_point: data
            options:
                ui:
                    ui_launch_mode: form
                    entrypoint_type: text
                    default:
                        input: 'default input'
                        context:
                            - key: 'key1'
                              value: 'value1'
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.form_constraints:
            description: 'Process launched with the UI form, with constraints on the context'
            entry_point: data
            options:
                ui:
                    ui_launch_mode: form
                    constraints:
                        - Collection:
                              fields:
                                  input: ~
                                  context:
                                      - Collection:
                                            fields:
                                                key1:
                                                    - NotBlank: ~
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.form_fields:
            description: 'Process launched with the UI form, with declared context fields'
            entry_point: data
            options:
                ui:
                    ui_launch_mode: form
                    form:
                        context:
                            delimiter:
                                type: Symfony\Component\Form\Extension\Core\Type\ChoiceType
                                default: ','
                                options:
                                    choices: { 'Comma': ',', 'Semicolon': ';' }
                            dry_run:
                                type: Symfony\Component\Form\Extension\Core\Type\CheckboxType
                                options: { required: false }
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.form_fields_date:
            description: 'Process launched with the UI form, with declared date fields'
            entry_point: data
            options:
                ui:
                    ui_launch_mode: form
                    form:
                        context:
                            from:
                                type: Symfony\Component\Form\Extension\Core\Type\DateType
                                options: { widget: single_text, input: datetime_immutable, required: false }
                            to:
                                type: Symfony\Component\Form\Extension\Core\Type\DateType
                                default: '2026-01-02'
                                options: { widget: single_text, input: string }
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.form_upload:
            description: 'Process launched with the UI form, declared file input and context fields'
            entry_point: data
            options:
                ui:
                    ui_launch_mode: form
                    form:
                        input:
                            type: Symfony\Component\Form\Extension\Core\Type\FileType
                            options:
                                constraints:
                                    - File:
                                          # A CSV file is often detected as "text/plain" (semicolon delimiter, few lines): allow it explicitly
                                          extensions:
                                              csv: ['text/csv', 'text/plain', 'application/csv', 'text/x-csv', 'text/x-comma-separated-values']
                        context:
                            delimiter:
                                type: Symfony\Component\Form\Extension\Core\Type\ChoiceType
                                default: ','
                                options:
                                    choices: { 'Comma': ',', 'Semicolon': ';' }
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.form_custom_constraint:
            description: 'Process launched with the UI form, with a field constraint given by its FQCN'
            options:
                ui:
                    ui_launch_mode: form
                    form:
                        context:
                            count:
                                type: Symfony\Component\Form\Extension\Core\Type\IntegerType
                                options:
                                    constraints:
                                        - CleverAge\UiProcessBundle\Tests\App\Validator\Even: ~
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.form_strict:
            description: 'Process launched with the UI form, without free context'
            entry_point: data
            options:
                ui:
                    ui_launch_mode: form
                    form:
                        context:
                            delimiter:
                                default: ','
                        allow_extra_context: false
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.form_global_constraints:
            description: 'Process launched with the UI form, with global constraints on a declared context field'
            entry_point: data
            options:
                ui:
                    ui_launch_mode: form
                    form:
                        context:
                            code: ~
                        constraints:
                            - Collection:
                                  fields:
                                      input: ~
                                      context:
                                          - Collection:
                                                allowExtraFields: true
                                                fields:
                                                    code:
                                                        - NotBlank: ~
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.form_enum:
            description: 'Process launched with the UI form, with a pure enum field'
            entry_point: data
            options:
                ui:
                    ui_launch_mode: form
                    form:
                        context:
                            choice:
                                type: Symfony\Component\Form\Extension\Core\Type\EnumType
                                options: { class: CleverAge\UiProcessBundle\Tests\Form\Fixtures\PureEnum }
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.form_enum_default:
            description: 'Process launched with the UI form, with a backed enum field and its default value'
            options:
                ui:
                    ui_launch_mode: form
                    form:
                        context:
                            delimiter:
                                type: Symfony\Component\Form\Extension\Core\Type\EnumType
                                default: !php/enum CleverAge\UiProcessBundle\Tests\Form\Fixtures\StringBackedEnum::Comma
                                options: { class: CleverAge\UiProcessBundle\Tests\Form\Fixtures\StringBackedEnum }
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.form_object:
            description: 'Process launched with the UI form, with a field returning an object that is not stringable'
            entry_point: data
            options:
                ui:
                    ui_launch_mode: form
                    form:
                        context:
                            entity:
                                type: CleverAge\UiProcessBundle\Tests\App\Form\EntityIdType
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.upload:
            description: 'Process launched with the UI form, file input'
            entry_point: data
            options:
                ui:
                    ui_launch_mode: form
                    entrypoint_type: file
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.private:
            public: false
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.failing:
            description: 'Process failing on initialization (missing required option)'
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\ConstantOutputTask'
        test.notification:
            public: false
            options:
                notification:
                    enabled: true
                    statuses: [finish]
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'
        test.notification_failing:
            public: false
            options:
                notification:
                    enabled: true
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\ConstantOutputTask'
        test.logs_retention:
            public: false
            options:
                logs:
                    database_max_days: 90
                    file_max_days: 365
            tasks:
                data:
                    service: '@CleverAge\ProcessBundle\Task\DummyTask'

twig_component:
    anonymous_template_directory: 'components/'
    defaults:
        App\Twig\Components\: 'components/'
