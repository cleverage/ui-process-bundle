parameters:
    upload_directory: '%kernel.cache_dir%/uploads'
    # SQLite by default; the CI runs the migrations on MySQL / MariaDB / PostgreSQL with DATABASE_URL
    env(DATABASE_URL): 'sqlite:///%kernel.cache_dir%/test.db'

framework:
    secret: 'test'
    test: true
    http_method_override: false
    # Defaults of Symfony 7.0, not setting them is deprecated with Symfony 6.4
    handle_all_throwables: true
    php_errors:
        log: true
    uid:
        default_uuid_version: 7
        time_based_uuid_version: 7
    session:
        storage_factory_id: session.storage.factory.mock_file
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    router:
        utf8: true
    messenger:
        transports:
            execute_process: 'in-memory://'
            scheduler_cron: 'in-memory://'
    validation:
        email_validation_mode: html5
    notifier:
        chatter_transports:
            test: 'null://null'
        channel_policy:
            high: ['chat/test']
            medium: ['chat/test']
            low: ['chat/test']

security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: plaintext
    firewalls:
        main:
            lazy: true

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        auto_mapping: true
        # As the Symfony recipe: the indexes of the bundle entities use snake_case column names
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
            CleverAgeUiProcessBundle:
                type: attribute
                is_bundle: true

monolog:
    handlers:
        main:
            type: 'null'

twig:
    default_path: '%kernel.project_dir%/templates'

twig_component:
    anonymous_template_directory: 'components/'
    defaults:
        App\Twig\Components\: 'components/'
