name: Test

on:
  push:
    branches:
      - main
  pull_request:
  # Weekly build: the dependencies are not locked, a new version of a dependency may break the build
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the build of the previous one, on a pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: PHP ${{ matrix.php-version }} + ${{ matrix.dependencies }}${{ matrix.symfony-require && format(' + Symfony {0}', matrix.symfony-require) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMFONY_REQUIRE: ${{matrix.symfony-require}}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest versions allowed by composer.json, on the lowest supported PHP version
          - { php-version: '8.2', dependencies: lowest, symfony-require: '' }
          # Highest versions, for each supported Symfony version (8.x requires PHP 8.4)
          - { php-version: '8.2', dependencies: highest, symfony-require: 6.4.* }
          - { php-version: '8.2', dependencies: highest, symfony-require: 7.4.* }
          - { php-version: '8.3', dependencies: highest, symfony-require: 6.4.* }
          - { php-version: '8.3', dependencies: highest, symfony-require: 7.4.* }
          - { php-version: '8.4', dependencies: highest, symfony-require: 6.4.* }
          - { php-version: '8.4', dependencies: highest, symfony-require: 7.4.* }
          - { php-version: '8.4', dependencies: highest, symfony-require: 8.* }
          - { php-version: '8.5', dependencies: highest, symfony-require: 6.4.* }
          - { php-version: '8.5', dependencies: highest, symfony-require: 7.4.* }
          - { php-version: '8.5', dependencies: highest, symfony-require: 8.* }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PHP with extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: composer:v2, flex
      - name: Add PHPUnit matcher
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
      - name: Install Composer dependencies (${{ matrix.dependencies }})
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - name: Run Tests with coverage
        run: vendor/bin/phpunit -c phpunit.xml.dist --coverage-clover build/logs/clover.xml
      #- name: Send coverage to Codecov
      #  uses: codecov/codecov-action@v4
      #  with:
      #    files: build/logs/clover.xml

  migrations:
    name: Migrations ${{ matrix.database }} + DBAL ${{ matrix.dbal }}${{ matrix.sql-mode == 'non-strict' && ' (non-strict SQL mode)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony-require }}
      DATABASE_URL: ${{ matrix.database-url }}

    strategy:
      fail-fast: false
      matrix:
        database: [mysql, mariadb, postgresql]
        dbal: ['3', '4']
        sql-mode: [strict]
        include:
          - database: mysql
            image: mysql:8.4
            port: 3306
            health-cmd: mysqladmin ping -h 127.0.0.1
            database-url: mysql://app:app@127.0.0.1:3306/app?serverVersion=8.4.0
          - database: mariadb
            image: mariadb:11.4
            port: 3306
            health-cmd: healthcheck.sh --connect --innodb_initialized
            database-url: mysql://app:app@127.0.0.1:3306/app?serverVersion=11.4.0-MariaDB
          - database: postgresql
            image: postgres:17
            port: 5432
            health-cmd: pg_isready -U app
            database-url: postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8
          - dbal: '3'
            php-version: '8.4'
            symfony-require: 7.4.*
          - dbal: '4'
            php-version: '8.5'
            symfony-require: ''
          # Without a strict SQL mode, MySQL changes some columns with ALGORITHM=COPY (#185). A new combination, as
          # sql-mode is a matrix value: every value is repeated
          - database: mysql
            dbal: '4'
            sql-mode: non-strict
            image: mysql:8.4
            port: 3306
            health-cmd: mysqladmin ping -h 127.0.0.1
            database-url: mysql://app:app@127.0.0.1:3306/app?serverVersion=8.4.0
            php-version: '8.5'
            symfony-require: ''

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app
          MARIADB_USER: app
          MARIADB_PASSWORD: app
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health-cmd }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PHP with extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2, flex
      - name: Require DBAL 3
        if: matrix.dbal == '3'
        run: composer require doctrine/dbal:^3.10 --no-update
      - name: Install Composer dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          dependency-versions: highest
      - name: Non-strict SQL mode
        if: matrix.sql-mode == 'non-strict'
        run: mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL sql_mode = ''"
      - name: Run the migrations
        run: tests/App/bin/console doctrine:migrations:migrate --no-interaction
      # DBAL 3 does not read the PostgreSQL identity columns created by the migrations (it expects sequences): the
      # schema is always reported as out of sync, inserts work (the ORM uses the sequence of the identity column)
      - name: Validate the schema
        if: matrix.dbal != '3' || matrix.database != 'postgresql'
        run: tests/App/bin/console doctrine:schema:validate
      - name: Revert the migrations
        run: tests/App/bin/console doctrine:migrations:migrate first --no-interaction
      - name: Run the migrations again
        run: tests/App/bin/console doctrine:migrations:migrate --no-interaction
      - name: Validate the schema again
        if: matrix.dbal != '3' || matrix.database != 'postgresql'
        run: tests/App/bin/console doctrine:schema:validate

  # Single check to require in the branch protection of main: its name does not depend on the matrix
  tests-passed:
    name: Tests passed
    if: always()
    needs: [test, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the result of the jobs
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
