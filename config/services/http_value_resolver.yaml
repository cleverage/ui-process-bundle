services:
    cleverage_ui_process.http_value_resolver.http_process_execute:
        class: CleverAge\UiProcessBundle\Http\ValueResolver\HttpProcessExecuteValueResolver
        public: false
        arguments:
            - '%upload_directory%'
            - '@serializer'
        tags:
            # Targeted value resolver: #[ValueResolver('http_process_execution')], as #[AsTargetedValueResolver]
            - controller.targeted_value_resolver: { name: http_process_execution }
            - controller.argument_value_resolver
