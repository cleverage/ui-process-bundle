services:
    cleverage_ui_process.repository.process_execution:
        class: CleverAge\UiProcessBundle\Repository\ProcessExecutionRepository
        public: false
        # Lazy: the Monolog handlers of the bundle depend on it, and its constructor loads the metadata of the entity,
        # which must not happen when the kernel boots (DoctrineMetadataCacheWarmer fails on cache:clear in prod)
        lazy: true
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@doctrine'
    CleverAge\UiProcessBundle\Repository\ProcessExecutionRepository:
        alias: cleverage_ui_process.repository.process_execution

    cleverage_ui_process.repository.process_schedule:
        class: CleverAge\UiProcessBundle\Repository\ProcessScheduleRepository
        public: false
        arguments:
            - '@doctrine.orm.entity_manager'
    CleverAge\UiProcessBundle\Repository\ProcessScheduleRepository:
        alias: cleverage_ui_process.repository.process_schedule
