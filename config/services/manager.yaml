services:
    cleverage_ui_process.manager.process_execution:
        class: CleverAge\UiProcessBundle\Manager\ProcessExecutionManager
        public: false
        arguments:
            - '@cleverage_ui_process.repository.process_execution'
        tags:
            - { name: kernel.reset, method: reset }
    CleverAge\UiProcessBundle\Manager\ProcessExecutionManager:
        alias: cleverage_ui_process.manager.process_execution

    cleverage_ui_process.manager.process_configuration:
        class: CleverAge\UiProcessBundle\Manager\ProcessConfigurationsManager
        public: false
        arguments:
            - '@cleverage_process.registry.process_configuration'
    CleverAge\UiProcessBundle\Manager\ProcessConfigurationsManager:
        alias: cleverage_ui_process.manager.process_configuration

    cleverage_ui_process.manager.uploaded_file:
        class: CleverAge\UiProcessBundle\Manager\UploadedFileManager
        public: false
        arguments:
            - '%cleverage_ui_process.upload_directory%'
            - '%cleverage_ui_process.delete_uploaded_files%'

    cleverage_ui_process.stop_checker.process_execution:
        class: CleverAge\UiProcessBundle\StopChecker\ProcessExecutionStopChecker
        public: false
        arguments:
            - '@cleverage_ui_process.manager.process_execution'
            - '@doctrine.orm.entity_manager'
            - 5
            - '@logger'
        tags:
            - { name: 'cleverage_process.stop_checker' }
            - { name: 'monolog.logger', channel: 'cleverage_process' }
